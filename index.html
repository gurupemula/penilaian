<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Guru Pemula</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Guru Pemula</h1>
    <p class="subtitle">Masuk untuk mengakses aplikasi</p>

    <div id="error-msg" class="login-error"></div>

    <form id="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required minlength="6" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Masuk</button>
    </form>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    redirectIfLoggedIn();

    const form = document.getElementById("auth-form");
    const errorMsg = document.getElementById("error-msg");
    const loading = document.getElementById("loading");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";
      loading.classList.add("show");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        loading.classList.remove("show");
        let message = "Terjadi kesalahan. Coba lagi.";

        switch (error.code) {
          case "auth/user-not-found":
          case "auth/wrong-password":
          case "auth/invalid-credential":
            message = "Email atau password salah.";
            break;
          case "auth/invalid-email":
            message = "Format email tidak valid.";
            break;
          case "auth/too-many-requests":
            message = "Terlalu banyak percobaan. Coba lagi nanti.";
            break;
          case "auth/user-disabled":
            message = "Akun ini dinonaktifkan.";
            break;
        }

        errorMsg.textContent = message;
      }
    });
  </script>
</body>
</html>
