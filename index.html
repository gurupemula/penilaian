<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Penilaian Guru Pemula</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Guru Pemula</h1>
    <p class="subtitle">Masuk untuk mengakses aplikasi penilaian</p>

    <div id="error-msg" class="error-msg"></div>

    <form id="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Masuk</button>
    </form>

    <p class="toggle-auth">
      <span id="toggle-text">Belum punya akun?</span>
      <a href="#" id="toggle-link">Daftar di sini</a>
    </p>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <!-- Firebase SDK (compat version agar mudah digunakan) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // Redirect jika sudah login
    redirectIfLoggedIn();

    let isLoginMode = true;

    const form = document.getElementById("auth-form");
    const submitBtn = document.getElementById("submit-btn");
    const toggleLink = document.getElementById("toggle-link");
    const toggleText = document.getElementById("toggle-text");
    const errorMsg = document.getElementById("error-msg");
    const loading = document.getElementById("loading");

    // Toggle antara Login dan Daftar
    toggleLink.addEventListener("click", (e) => {
      e.preventDefault();
      isLoginMode = !isLoginMode;

      if (isLoginMode) {
        submitBtn.textContent = "Masuk";
        toggleText.textContent = "Belum punya akun?";
        toggleLink.textContent = "Daftar di sini";
      } else {
        submitBtn.textContent = "Daftar";
        toggleText.textContent = "Sudah punya akun?";
        toggleLink.textContent = "Masuk di sini";
      }

      errorMsg.classList.remove("show");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      loading.classList.add("show");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        if (isLoginMode) {
          await auth.signInWithEmailAndPassword(email, password);
        } else {
          await auth.createUserWithEmailAndPassword(email, password);
        }
        // Redirect akan ditangani oleh onAuthStateChanged di redirectIfLoggedIn
        window.location.href = "dashboard.html";
      } catch (error) {
        loading.classList.remove("show");
        let message = "Terjadi kesalahan. Coba lagi.";

        switch (error.code) {
          case "auth/user-not-found":
          case "auth/wrong-password":
          case "auth/invalid-credential":
            message = "Email atau password salah.";
            break;
          case "auth/email-already-in-use":
            message = "Email sudah terdaftar. Silakan masuk.";
            break;
          case "auth/weak-password":
            message = "Password minimal 6 karakter.";
            break;
          case "auth/invalid-email":
            message = "Format email tidak valid.";
            break;
          case "auth/too-many-requests":
            message = "Terlalu banyak percobaan. Coba lagi nanti.";
            break;
        }

        errorMsg.textContent = message;
        errorMsg.classList.add("show");
      }
    });
  </script>
</body>
</html>
