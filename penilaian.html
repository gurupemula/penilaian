<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penilaian - Guru Pemula</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><a href="dashboard.html">Guru Pemula</a></div>
      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-tab="input"><span class="nav-ico">✎</span> Input Nilai</button>
        <button type="button" class="nav-item" data-tab="rekap"><span class="nav-ico">▦</span> Rekap</button>
        <button type="button" class="nav-item" data-tab="siswa"><span class="nav-ico">☰</span> Siswa</button>
        <button type="button" class="nav-item" data-tab="tp"><span class="nav-ico">☰</span> Kurikulum</button>
      </nav>
      <div class="sidebar-foot">
        <a href="dashboard.html" class="nav-item link">← Dashboard</a>
        <button type="button" class="nav-item link" onclick="logout()">Keluar</button>
        <div class="sidebar-user" id="user-email">...</div>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu">☰</button>
        <h1 class="topbar-title" id="topbar-title">Input Nilai</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <div class="app-content">
        <div id="success-msg" class="flash flash-ok"></div>
        <div id="error-msg" class="flash flash-err"></div>

        <section id="tab-input" class="tab-panel">
          <div class="filter-bar">
            <div class="ff">
              <label>Semester</label>
              <select id="sel-semester">
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="kedua">Semua (S1+S2)</option>
              </select>
            </div>
            <div class="ff">
              <label>Mapel</label>
              <select id="sel-mapel"></select>
            </div>
            <div class="ff">
              <label>TP</label>
              <select id="sel-tp" disabled><option value="">—</option></select>
            </div>
            <div class="ff ff-grow">
              <label>Kompetensi</label>
              <select id="sel-kompetensi" disabled><option value="">—</option></select>
            </div>
          </div>
          <p class="hint" id="semester-hint" style="margin:-.35rem 0 .75rem">TP difilter menurut bobot S1/S2 di Kurikulum.</p>

          <div id="input-workspace" class="hidden">
            <div class="toolbar-row">
              <div class="ff">
                <label>Tanggal</label>
                <input type="date" id="tanggal" />
              </div>
              <div class="ff ff-grow">
                <label>Catatan</label>
                <input type="text" id="catatan" placeholder="Opsional" />
              </div>
              <button type="button" class="btn btn-primary" id="btn-simpan">Simpan nilai</button>
            </div>
            <p class="hint" id="nilai-session-info" style="margin:.25rem 0 .75rem"></p>
            <div class="table-scroll">
              <table class="sheet">
                <thead>
                  <tr>
                    <th class="w-abs">No</th>
                    <th>Nama</th>
                    <th class="w-nilai">Nilai</th>
                  </tr>
                </thead>
                <tbody id="tbody-nilai"></tbody>
              </table>
            </div>
          </div>

          <div id="input-empty" class="empty-hint">
            Pilih Semester → Mapel → TP → Kompetensi, lalu isi nilai seperti spreadsheet.
          </div>
        </section>

        <section id="tab-rekap" class="tab-panel" hidden></section>
        <section id="tab-siswa" class="tab-panel" hidden></section>
        <section id="tab-tp" class="tab-panel" hidden></section>
      </div>
    </div>
  </div>

  <div class="loading-overlay" id="loading"><div class="spinner"></div></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/siswa-db.js"></script>
  <script src="js/tp-db.js"></script>
  <script src="js/nilai-db.js"></script>
  <script src="js/penilaian-calc.js"></script>
  <script src="js/penilaian-rekap.js"></script>
  <script src="js/penilaian-tp-tab.js"></script>
  <script src="js/penilaian-ui.js"></script>
  <script>requireAuth(); showUserEmail();</script>
</body>
</html>
